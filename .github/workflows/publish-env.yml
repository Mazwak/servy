name: publish-fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CONFIGURATION: Release
      TFM: net10.0-windows
      ISCC: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      MAX_RETRIES: 5
      RUNTIME: win-x64
      ARCH: x64
      ISS_FILE: 'setup\servy.iss'
      INNO_SETUP_VERSION: "6.6.1"
      INNO_SETUP_HASH: "d243ce440c02705530699554fb9612b9b2bd7a2a90629cdb7f41e66f5faeb91f"
      SEVEN_ZIP_VERSION: "26.01"
      SEVEN_ZIP_HASH: "d64a0468f5b5b0b0fc5b2188450bcd655b70809d97b1c4535f2884635094377d"

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        shell: pwsh
        id: get_version
        run: |
          $cfg = & setup/build-config.ps1
          if (-not $cfg.Version) { throw "Version missing" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($cfg.Version)"

      - name: Set VERSION env
        shell: pwsh
        env:
          RESOLVED_VERSION: ${{ steps.get_version.outputs.version }}
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$env:RESOLVED_VERSION"

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          max_retries: ${{ env.MAX_RETRIES }}

      - name: Install CycloneDX Tools
        uses: ./.github/actions/setup-cyclonedx

      # ---- Inno Setup ----
      - name: Stage Inno Setup URL
        shell: pwsh
        run: |
          $v = $env:INNO_SETUP_VERSION
          $uv = $v.Replace(".", "_")
          Add-Content -Path $env:GITHUB_ENV -Value "INNO_URL=https://github.com/jrsoftware/issrc/releases/download/is-$uv/innosetup-$v.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "INNO_OUT=innosetup.exe"

      - uses: ./.github/actions/download-with-retry
        with:
          url: ${{ env.INNO_URL }}
          output_path: ${{ env.INNO_OUT }}
          asset_name: 'Inno Setup Installer'
          max_retries: ${{ env.MAX_RETRIES }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $h = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash
          if ($h -ne $env:INNO_SETUP_HASH) { throw "Inno Setup hash mismatch" }
          Start-Process ".\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          if (-not (Test-Path $env:ISCC)) { throw "ISCC missing" }

      # ---- 7-Zip ----
      - name: Stage 7-Zip URL
        shell: pwsh
        run: |
          $v = $env:SEVEN_ZIP_VERSION
          $fv = $v.Replace(".", "")
          Add-Content -Path $env:GITHUB_ENV -Value "SEVENZ_URL=https://github.com/ip7z/7zip/releases/download/$v/7z$fv-x64.exe"
          Add-Content -Path $env:GITHUB_ENV -Value "SEVENZ_OUT=7z_setup.exe"

      - uses: ./.github/actions/download-with-retry
        with:
          url: ${{ env.SEVENZ_URL }}
          output_path: ${{ env.SEVENZ_OUT }}
          asset_name: '7-Zip Installer'
          max_retries: ${{ env.MAX_RETRIES }}

      - name: Install 7-Zip
        shell: pwsh
        run: |
          $h = (Get-FileHash 7z_setup.exe -Algorithm SHA256).Hash
          if ($h -ne $env:SEVEN_ZIP_HASH) { throw "7-Zip hash mismatch" }
          Start-Process ".\7z_setup.exe" -ArgumentList "/S","/D=C:\7-Zip" -Wait
          Add-Content -Path $env:GITHUB_ENV -Value "SEVEN_ZIP=C:\7-Zip\7z.exe"

      # ---- Build/test ----
      - name: Restore
        shell: pwsh
        run: dotnet restore Servy.sln

      - name: Build
        shell: pwsh
        run: dotnet build Servy.sln --configuration $env:CONFIGURATION --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test Servy.sln --configuration $env:CONFIGURATION --no-build --filter "Category!=Stress"

      # ---- Publish each exe (NO signing) ----
      - name: Publish Servy.Host
        shell: pwsh
        run: |
          dotnet publish src\Servy.Host\Servy.Host.csproj -c $env:CONFIGURATION -r $env:RUNTIME -f $env:TFM --self-contained true /p:DeleteExistingFiles=true
          Copy-Item "src/Servy.Host/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Host.exe" "src/Servy/Resources/" -Force
          Copy-Item "src/Servy.Host/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Host.exe" "src/Servy.Manager/Resources/" -Force
          Copy-Item "src/Servy.Host/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Host.exe" "src/Servy.CLI/Resources/" -Force

      - name: Publish Servy.Restarter
        shell: pwsh
        run: |
          dotnet publish src\Servy.Restarter\Servy.Restarter.csproj -c $env:CONFIGURATION -r $env:RUNTIME -f $env:TFM --self-contained true /p:DeleteExistingFiles=true
          Copy-Item "src/Servy.Restarter/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Restarter.exe" "src/Servy/Resources/" -Force
          Copy-Item "src/Servy.Restarter/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Restarter.exe" "src/Servy.Manager/Resources/" -Force
          Copy-Item "src/Servy.Restarter/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Restarter.exe" "src/Servy.CLI/Resources/" -Force

      - name: Publish Servy.Service
        shell: pwsh
        run: |
          dotnet publish src\Servy.Service\Servy.Service.csproj -c $env:CONFIGURATION -r $env:RUNTIME -f $env:TFM --self-contained true /p:DeleteExistingFiles=true
          Copy-Item "src/Servy.Service/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Service.exe" "src/Servy/Resources/" -Force
          Copy-Item "src/Servy.Service/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Service.exe" "src/Servy.Manager/Resources/" -Force
          Copy-Item "src/Servy.Service/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish/Servy.Service.exe" "src/Servy.CLI/Resources/Servy.Service.CLI.exe" -Force

      - name: Publish Servy (desktop)
        shell: pwsh
        run: dotnet publish src\Servy\Servy.csproj -c $env:CONFIGURATION -r $env:RUNTIME -f $env:TFM --self-contained true /p:DeleteExistingFiles=true

      - name: Publish Servy.Manager
        shell: pwsh
        run: dotnet publish src\Servy.Manager\Servy.Manager.csproj -c $env:CONFIGURATION -r $env:RUNTIME -f $env:TFM --self-contained true /p:DeleteExistingFiles=true

      - name: Publish Servy.CLI
        shell: pwsh
        run: dotnet publish src\Servy.CLI\Servy.CLI.csproj -c $env:CONFIGURATION -r $env:RUNTIME -f $env:TFM --self-contained true /p:DeleteExistingFiles=true

      # ---- Installer ----
      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC" "$env:ISS_FILE" /DMyAppVersion=$env:VERSION /DArch=$env:ARCH /DBuildConfiguration=$env:CONFIGURATION /DTfm=$env:TFM

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: servy-${{ env.VERSION }}-${{ env.ARCH }}-installer
          path: setup/servy-${{ env.VERSION }}-${{ env.ARCH }}-installer.exe
          if-no-files-found: error

      # ---- Portable 7z ----
      - name: Build portable 7z
        shell: pwsh
        run: |
          . setup/publish-common.ps1
          $pkg = "servy-$env:VERSION-$env:ARCH-portable"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          $servy   = "src/Servy/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish"
          $cli     = "src/Servy.CLI/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish"
          $manager = "src/Servy.Manager/bin/$env:CONFIGURATION/$env:TFM/$env:RUNTIME/publish"

          Copy-Item (Join-Path $servy 'Servy.exe') $pkg -Force
          Copy-Item (Join-Path $manager 'Servy.Manager.exe') $pkg -Force
          Copy-Item (Join-Path $cli 'Servy.CLI.exe') "$pkg\servy-cli.exe" -Force
          Copy-Item "src/Servy.CLI/Servy.psm1" $pkg -Force
          Copy-Item "src/Servy.CLI/Servy.psd1" $pkg -Force
          Copy-Item "src/Servy.CLI/servy-module-examples.ps1" $pkg -Force
          Copy-Item "src/Servy.CLI/Servy-Dump.ps1" $pkg -Force
          Copy-Item "src/Servy.CLI/Servy-Restore.ps1" $pkg -Force

          $destPath = Join-Path $pkg "taskschd"
          if (-not (Test-Path $destPath)) { New-Item -Path $destPath -ItemType Directory -Force | Out-Null }
          Copy-TaskSchdArtifacts -SourcePath "setup\taskschd" -DestPath $destPath

          & "$env:SEVEN_ZIP" a -t7z -m0=lzma2 -mx=9 -mfb=273 -md=128m -ms=on "$pkg.7z" "$pkg"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed" }
          Remove-Item $pkg -Recurse -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: servy-${{ env.VERSION }}-${{ env.ARCH }}-portable
          path: servy-${{ env.VERSION }}-${{ env.ARCH }}-portable.7z
          if-no-files-found: error
